<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="osu!standard 방식의 독립 웹 리듬게임" />
    <meta name="theme-color" content="#05060b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff4057'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E" />
    <title>MEGALOVANIA Rhythm Game</title>
  </head>
  <body>
    <a class="skip-link" href="#menu-panel">곡 선택으로 건너뛰기</a>
    <main class="app-shell" aria-labelledby="app-title">
      <canvas id="gameplay" width="1024" height="768" aria-label="게임 플레이 화면"></canvas>
      <div class="selection-atmosphere" aria-hidden="true">
        <div class="selection-atmosphere__beam"></div>
        <img id="selection-mode-artwork" width="256" height="256" alt="">
      </div>
      <section id="menu-panel" class="menu-panel" tabindex="-1" aria-describedby="stage-status">
        <header class="selection-header">
          <div translate="no"><p class="eyebrow">OSU! TABLE</p><p class="selection-kicker">SONG SELECT</p></div>
          <img id="mode-artwork" class="mode-artwork" width="128" height="128" alt="" aria-hidden="true">
        </header>
        <article class="song-card" aria-labelledby="app-title">
          <div class="song-card-art" aria-hidden="true"><img id="song-card-artwork" width="128" height="128" alt=""></div>
          <div class="song-card-copy">
            <p class="song-source">UNDERTALE</p>
            <h1 id="app-title" translate="no">MEGALOVANIA</h1>
            <p id="song-credit" class="song-credit">toby fox · beatmap by Kyshiro</p>
          </div>
          <button id="difficulty-toggle" class="difficulty-toggle" type="button" aria-expanded="true" aria-controls="difficulty-region">
            <span>난이도 5개</span><span aria-hidden="true">⌄</span>
          </button>
        </article>
        <div id="difficulty-region" class="difficulty-region">
          <button id="difficulty-previous" class="carousel-arrow carousel-arrow--previous" type="button" aria-label="이전 난이도"><span aria-hidden="true">‹</span></button>
          <div id="difficulty-rail" class="difficulty-rail" role="listbox" aria-label="난이도 캐러셀"></div>
          <button id="difficulty-next" class="carousel-arrow carousel-arrow--next" type="button" aria-label="다음 난이도"><span aria-hidden="true">›</span></button>
        </div>
        <label class="visually-hidden" for="difficulty-select">난이도</label>
        <select id="difficulty-select" name="difficulty" autocomplete="off" class="visually-hidden" aria-label="난이도 선택"></select>
        <section class="selection-detail" aria-label="선택한 난이도 정보">
          <div class="selection-detail-heading"><span>BEATMAP DATA</span><strong id="selected-difficulty-name">INSANE</strong></div>
          <p id="stage-status" aria-live="polite">카탈로그를 준비하고 있습니다.</p>
          <dl id="difficulty-stats" class="difficulty-stats" aria-live="polite"></dl>
          <div class="play-actions">
            <button id="preview-button" class="preview-button" type="button" disabled>미리듣기</button>
            <button id="start-button" type="button" disabled>콘텐츠 준비 중</button>
          </div>
        </section>
        <details id="settings-panel" class="settings-panel">
          <summary><span>SETUP</span><strong>플레이 설정</strong></summary>
          <div class="settings-grid">
            <h3>타이밍</h3>
            <label for="offset-setting">입력 오프셋 <output id="offset-output">0ms</output></label><input id="offset-setting" name="offset" type="range" min="-200" max="200" step="1" value="0">
            <h3>오디오</h3>
            <label for="master-volume">마스터 <output id="master-output">100%</output></label><input id="master-volume" name="master-volume" type="range" min="0" max="1" step="0.05" value="1">
            <label for="music-volume">음악 <output id="music-output">100%</output></label><input id="music-volume" name="music-volume" type="range" min="0" max="1" step="0.05" value="1">
            <label for="effect-volume">효과음 <output id="effect-output">100%</output></label><input id="effect-volume" name="effect-volume" type="range" min="0" max="1" step="0.05" value="1">
            <label for="story-volume">Storyboard <output id="story-output">100%</output></label><input id="story-volume" name="storyboard-volume" type="range" min="0" max="1" step="0.05" value="1">
            <h3>화면</h3>
            <label for="background-dim">배경 어둡기 <output id="dim-output">65%</output></label><input id="background-dim" name="background-dim" type="range" min="0" max="1" step="0.05" value="0.65">
            <label for="cursor-scale">커서 크기 <output id="cursor-output">100%</output></label><input id="cursor-scale" name="cursor-scale" type="range" min="0.5" max="2" step="0.1" value="1">
            <label class="check-row" for="hud-detail-enabled"><input id="hud-detail-enabled" name="hud-detail" type="checkbox" checked> 상세 판정과 타이밍 바</label>
            <label class="check-row" for="input-overlay-enabled"><input id="input-overlay-enabled" name="input-overlay" type="checkbox" checked> K1/K2/M1/M2 입력 표시</label>
            <label class="check-row" for="fps-enabled"><input id="fps-enabled" name="fps" type="checkbox"> FPS 진단 표시</label>
            <h3>입력</h3>
            <label for="key-left">왼쪽 키</label><input id="key-left" name="key-left" type="text" value="Z" readonly autocomplete="off" spellcheck="false" aria-describedby="key-help">
            <label for="key-right">오른쪽 키</label><input id="key-right" name="key-right" type="text" value="X" readonly autocomplete="off" spellcheck="false" aria-describedby="key-help">
            <small id="key-help">입력 칸을 선택하고 원하는 키를 누르세요.</small>
            <label class="check-row" for="cursor-trail"><input id="cursor-trail" name="cursor-trail" type="checkbox" checked> 커서 트레일</label>
            <label class="check-row" for="storyboard-enabled"><input id="storyboard-enabled" name="storyboard" type="checkbox" checked> Storyboard 표시</label>
          </div>
          <div class="button-row"><button id="fullscreen-button" type="button">전체 화면</button><button id="reset-settings" type="button">기본값 복원</button></div>
        </details>
      </section>
      <dialog id="flow-dialog" aria-labelledby="dialog-title">
        <img id="dialog-panel-artwork" class="dialog-panel-artwork" width="1280" height="720" alt="" aria-hidden="true">
        <img id="dialog-artwork" class="dialog-artwork" width="320" height="240" alt="" aria-hidden="true">
        <img id="dialog-section-artwork" class="dialog-section-artwork" width="512" height="128" alt="" aria-hidden="true">
        <h2 id="dialog-title">일시정지</h2>
        <div id="dialog-content"></div>
        <div class="dialog-actions"><button id="resume-button" type="button">계속하기</button><button id="restart-button" type="button">처음부터</button><button id="select-button" type="button">난이도 선택</button></div>
      </dialog>
      <pre id="debug-hud" class="debug-hud" hidden aria-label="성능 계측"></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
